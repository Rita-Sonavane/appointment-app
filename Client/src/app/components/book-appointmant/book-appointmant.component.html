<section class="book_section layout_padding">
    <div class="container">
        <div class="row">
            <div class="col">
                <form *ngIf="!showForm" [formGroup]="bookAppointmentForm" (ngSubmit)="onSubmit()">
                    <h4>
                        BOOK <span>APPOINTMENT</span>
                    </h4>
                    <div class="form-row ">
                        <div class="form-group col-lg-4">
                            <label for="inputPatientName">Title</label>
                            <input type="text" class="form-control" formControlName="title">
                        </div>
                        <!-- col-lg-8 -->
                        <div class="form-group col-lg-4">
                            <label for="inputPatientName">Description</label>
                            <!-- <input type="text"> -->
                            <textarea class="form-control" formControlName="description"></textarea>
                        </div>

                        <div class="form-group col-lg-4">
                            <label for="inputDoctorName">Priority</label>
                            <select name="" class="form-control custom-select wide" formControlName="priority"
                                placeholder="medium">
                                <option value="low">Low</option>
                                <option value="medium">Medium </option>
                                <option value="high">High </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">

                        <div class="form-group col-lg-4">
                            <label for="inputDoctorName">Status</label>
                            <select name="" class="form-control custom-select wide" formControlName="status"
                                placeholder="inProcess">
                                <option value="complete">Complete</option>
                                <option value="pending">Pending </option>
                                <option value="inProcess">In Process</option>
                            </select>
                        </div>


                        <div class="form-group col-lg-4">
                            <label for="inputDate">Deadline </label>
                            <div class="input-group " id="inputDate" data-date-format="mm-dd-yyyy">
                                <input type="date" class="form-control" formControlName="deadline">
                                <!-- <span class="input-group-addon date_icon">
                                    <i class="fa fa-calendar" aria-hidden="true"></i>
                                </span> -->
                            </div>
                        </div>

                        <div class="form-group col-lg-4">
                            <label for="inputDate">Reminder </label>
                            <div class="input-group " id="inputDate" data-date-format="mm-dd-yyyy">
                                <input type="datetime-local" class="form-control" formControlName="reminder">
                                <!-- <span class="input-group-addon date_icon">
                                    <i class="fa fa-calendar" aria-hidden="true"></i>
                                </span> -->
                            </div>
                        </div>

                        <!-- <div class="form-group col-lg-4">
                            <label for="inputDate">Choose Date </label>
                            <div class="input-group date" id="inputDate" data-date-format="mm-dd-yyyy">
                                <input type="text" class="form-control" readonly>
                                <span class="input-group-addon date_icon">
                                    <i class="fa fa-calendar" aria-hidden="true"></i>
                                </span>
                            </div>
                        </div> -->
                    </div>

                    <div class="btn-box">
                        <button type="submit" class="btn ">Submit Now</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>
