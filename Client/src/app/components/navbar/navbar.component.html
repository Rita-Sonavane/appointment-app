<div class="hero_area">
    <!-- header section strats -->
    <header class="header_section">

        <div class="header_bottom">
            <div class="container-fluid">
                <nav class="navbar navbar-expand-lg custom_nav-container ">
                    <a class="navbar-brand" href="index.html">
                        <img src="assets/images/logo1-removebg-preview.png" alt="">
                    </a>


                    <button class="navbar-toggler" type="button" data-toggle="collapse"
                        data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class=""> </span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <div class="d-flex mr-auto flex-column flex-lg-row align-items-center">
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <a class="nav-link" [routerLink]="['/home/list']" routerLinkActive="active"
                                        [routerLinkActiveOptions]="{ exact: true }">
                                        Appointment List <span class="sr-only">(current)</span>
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" [routerLink]="['/home/book']" routerLinkActive="active"
                                        [routerLinkActiveOptions]="{ exact: true }">
                                        Book Appointment
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <div class="quote_btn-container">
                            <a>
                                <i class="fa fa-user" aria-hidden="true"></i>
                                <span>
                                    {{currentUser}}
                                </span>
                            </a>
                            <a class="logout" (click)="logout()">
                                <i class="fa fa-user" aria-hidden="true"></i>
                                <span>
                                    Logout
                                </span>

                            </a>

                            <!-- <form class="form-inline">
                  <button class="btn  my-2 my-sm-0 nav_search-btn" type="submit">
                    <i class="fa fa-search" aria-hidden="true"></i>
                  </button>
                </form> -->
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <!-- end header section -->

</div>






<div class="container">
    <router-outlet></router-outlet>
</div>
